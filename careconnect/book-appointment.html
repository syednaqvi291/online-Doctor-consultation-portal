<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Appointment | CareConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: #f0f2f5; }
        .sidebar { width: 260px; background: #1a233a; height: 100vh; color: white; padding: 20px; position: fixed; }
        .nav-item { padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; color: #adb5bd; }
        .nav-item.active { background: #007bff; color: white; }
        .main-content { margin-left: 260px; padding: 40px; width: 100%; }
        .form-card { background: white; padding: 30px; border-radius: 12px; max-width: 500px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="color: #4facfe;">CareConnect</h2>
        <div class="nav-item" onclick="window.location.href='patient-dashboard.html'"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="nav-item active" onclick="window.location.href='book-appointment.html'"><i class="fas fa-calendar-alt"></i> Book Appointment</div>
        <div class="nav-item"><i class="fas fa-user-md"></i> Find Doctors</div>
    </div>

    <div class="main-content">
        <h1>Book an Appointment</h1>
        <div class="form-card">
            <label>Select Doctor</label>
            <select id="doctorSelect"><option>Loading...</option></select>
            <label>Date</label>
            <input type="date" id="appDate">
            <label>Time Slot</label>
            <select id="appTime">
                <option value="10:00 AM">10:00 AM</option>
                <option value="02:00 PM">02:00 PM</option>
            </select>
            <button onclick="bookNow()">Confirm Appointment</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        async function loadDoctors() {
            const res = await axios.get("http://localhost:5000/api/user/doctors");
            const select = document.getElementById('doctorSelect');
            select.innerHTML = res.data.map(d => `<option value="${d._id}">Dr. ${d.name}</option>`).join('');
        }

        async function bookNow() {
            const data = {
                doctorId: document.getElementById('doctorSelect').value,
                date: document.getElementById('appDate').value,
                time: document.getElementById('appTime').value,
                patientName: localStorage.getItem('userName')
            };
            try {
                await axios.post("http://localhost:5000/api/appointments/book", data);
                alert("Appointment Booked!");
                window.location.href = 'patient-dashboard.html';
            } catch (err) { alert("Error booking appointment"); }
        }
        window.onload = loadDoctors;
    </script>
</body>
</html>
