<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #00a4e4; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .auth-container { background: #fff; padding: 30px; border-radius: 20px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 15px; color: #888; }
        .input-group input, .input-group select { width: 100%; padding: 12px 12px 12px 40px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        .btn-main { width: 100%; padding: 12px; background: #00a4e4; border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .toggle-form { margin-top: 15px; color: #555; cursor: pointer; font-size: 14px; }
        .toggle-form span { color: #00a4e4; font-weight: bold; }
        .hidden { display: none !important; }
        h2 { margin-bottom: 20px; color: #333; }
    </style>
</head>
<body>

    <div class="auth-container">
        
        <div id="loginSection">
            <h2>Log In Secure</h2>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="loginEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            <div class="input-group">
                <i class="fas fa-user-shield"></i>
                <select id="loginRole">
                    <option value="Patient">Login as Patient</option>
                    <option value="Doctor">Login as Doctor</option>
                </select>
            </div>
            <button class="btn-main" onclick="loginUser()">Log In Secure</button>
            <div class="toggle-form" onclick="toggleAuth()">New user? <span>Register here</span></div>
        </div>

        <div id="registerSection" class="hidden">
            <h2>Create Profile</h2>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="regFullName" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="regPassword" placeholder="Enter password" required>
            </div>
            <div class="input-group">
                <i class="fas fa-user-tag"></i>
                <select id="regRole">
                    <option value="Patient">Register as Patient</option>
                    <option value="Doctor">Register as Doctor</option>
                </select>
            </div>
            <button class="btn-main" onclick="registerUser()">Sign Up Now</button>
            <div class="toggle-form" onclick="toggleAuth()">Already have an account? <span>Login</span></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://8x8.vc/external_api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
